
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>光の国の大冒険</title>
<style>
  :root { --primary: #ff6b9d; --bg: #0c1017; --text: #2f3542; }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: sans-serif; }
  body, html { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); }
  #app { width: 100%; max-width: 480px; height: 100%; margin: 0 auto; position: relative; background: linear-gradient(180deg, #a1c4fd, #c2e9fb); display: flex; flex-direction: column; }
  header { height: 50px; background: rgba(255,255,255,0.9); display: flex; align-items: center; justify-content: space-between; padding: 0 12px; z-index: 100; border-bottom: 2px solid rgba(255,255,255,0.5); }
  .badge { background: #fff; padding: 4px 10px; border-radius: 20px; font-weight: bold; font-size: 13px; border: 1.5px solid #e1b12c; }
  .screen { flex: 1; position: relative; overflow-y: auto; display: none; }
  .screen.active { display: block; }
  .map-container { position: relative; min-height: 650px; background: linear-gradient(135deg, #74ebe5, #89f7fe); }
  svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .node { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; cursor: pointer; z-index: 10; }
  .icon-box { width: 56px; height: 56px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 28px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); animation: float 3s infinite ease-in-out; }
  .locked .icon-box { filter: grayscale(1); opacity: 0.6; }
  .label { background: rgba(0,0,0,0.7); color: #fff; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: bold; margin-top: 4px; white-space: nowrap; }
  .avatar { position: absolute; width: 36px; height: 36px; background: #ffa502; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; border: 2px solid #fff; transition: all 0.7s; z-index: 20; pointer-events: none; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 200; padding: 20px; }
  .modal.active { display: flex; }
  .card { background: #fff; border-radius: 20px; padding: 20px; width: 100%; max-width: 360px; text-align: center; border: 4px solid var(--primary); }
  .btn { background: linear-gradient(180deg, #ff7675, #d63031); color: #fff; border: none; padding: 12px 24px; border-radius: 25px; font-weight: bold; font-size: 15px; width: 100%; cursor: pointer; margin-top: 12px; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
</style>
</head>
<body>
<div id="app">
  <header>
    <div style="display:flex; gap:8px;">
      <div class="badge">🪙 <span id="coins">0</span></div>
      <div class="badge">⭐ <span id="stars">0</span></div>
    </div>
    <button onclick="toggleTown()" style="border:none; background:#fff; width:36px; height:36px; border-radius:50%; font-size:18px;">☕</button>
  </header>

  <!-- WORLD MAP -->
  <div id="world-screen" class="screen active">
    <div class="map-container" id="world-map">
      <svg id="world-svg"></svg>
      <div id="player" class="avatar">🐱</div>
    </div>
  </div>

  <!-- STAGE MAP -->
  <div id="stage-screen" class="screen">
    <div style="background:#fff; padding:10px; display:flex; align-items:center; gap:10px;">
      <button onclick="showScreen('world-screen')" style="border:none; background:none; font-size:18px;">⬅️</button>
      <b id="stage-title">ステージ</b>
    </div>
    <div class="map-container" id="stage-map" style="background:#f1f2f6;">
      <svg id="stage-svg"></svg>
    </div>
  </div>

  <!-- TOWN SCREEN -->
  <div id="town-screen" class="screen">
    <div style="background:#fff; padding:10px; display:flex; align-items:center; gap:10px;">
      <button onclick="showScreen('world-screen')" style="border:none; background:none; font-size:18px;">⬅️</button>
      <b>☕ ひかりの街</b>
    </div>
    <div style="padding:15px; text-align:center;">
      <div id="town-items" style="height:150px; background:#81ecec; border-radius:15px; margin-bottom:15px; display:flex; align-items:center; justify-content:center; gap:10px; font-size:30px;"></div>
      <h3>街のアイテム</h3>
      <div id="shop" style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px;"></div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="card">
    <h3 id="m-title" style="color:var(--primary);">試練</h3>
    <div style="background:#f1f2f6; border-radius:10px; padding:10px; margin:10px 0; font-size:13px; text-align:left;">
      <b id="m-speaker">モコ：</b><span id="m-text"></span>
    </div>
    <div style="font-weight:bold;" id="m-task"></div>
    <button class="btn" onclick="clearTask()">✨ クリアしたよ！</button>
    <button onclick="closeModal()" style="border:none; background:none; color:#aaa; margin-top:8px; font-size:12px;">あとで</button>
  </div>
</div>

<script>
const AREAS = [
  { id: "eiko", name: "栄光の丘", icon: "🏰", x: 50, y: 80, req: 0 },
  { id: "english", name: "英語の海", icon: "🌊", x: 25, y: 55, req: 3 },
  { id: "music", name: "音楽の街", icon: "🎹", x: 75, y: 55, req: 6 },
  { id: "korean", name: "韓国語の島", icon: "🇰🇷", x: 30, y: 30, req: 10 },
  { id: "japan", name: "和の島", icon: "🌸", x: 70, y: 30, req: 14 },
  { id: "hiroo", name: "ひろお学園", icon: "🏫", x: 50, y: 10, req: 20 }
];

const STAGES = {
  eiko: [
    { id: "m_sum", name: "サマー算数山", task: "算数：見開き1ページ", coin: 4, max: 30, icon: "⛰️" },
    { id: "j_sum", name: "サマー国語の森", task: "国語：見開き1ページ", coin: 4, max: 30, icon: "🌳" },
    { id: "s_sum", name: "サマー理科洞窟", task: "理科：見開き1ページ", coin: 4, max: 30, icon: "🦇" },
    { id: "c_past", name: "計算試練の塔", task: "計算日記：1ページ", coin: 2, max: 108, icon: "🧮" },
    { id: "k_past", name: "漢字試練の道", task: "漢字日記：1ページ", coin: 2, max: 108, icon: "🖌️" }
  ],
  english: [{ id: "ka_hw", name: "KA HW港", task: "KAホームワーク Day1〜3", coin: 3, max: 12, icon: "⛵" }],
  music: [{ id: "piano", name: "ピアノホール", task: "ピアノ練習：20分", coin: 3, max: 30, icon: "🎼" }],
  korean: [{ id: "ebs", name: "EBSシアター", task: "EBS：30分視聴", coin: 3, max: 30, icon: "📺" }],
  japan: [{ id: "wa", name: "和の道場", task: "やり直し・復習：15分", coin: 3, max: 30, icon: "🍵" }],
  hiroo: [{ id: "goal", name: "ひろお大門", task: "ひろお学園到着！", coin: 10, max: 1, icon: "👑" }]
};

const SHOP = [
  { id: "cafe", name: "カフェ", icon: "☕", price: 10 },
  { id: "flower", name: "お花畑", icon: "🪴", price: 5 },
  { id: "cat", name: "ネコ友達", icon: "🐾", price: 15 },
  { id: "dress", name: "ドレス", icon: "👗", price: 20 }
];

const VOICES = [
  { s: "モコ", a: "🐱", t: "今日も一緒に冒険に行こう！" },
  { s: "エバちゃん", a: "👧", t: "すごーい！一緒にがんばろう！" },
  { s: "あやさん", a: "👩", t: "自分のペースで進めば大丈夫♪" },
  { s: "お父さん", a: "👨", t: "集中して頑張ったね！すごいぞ！" }
];

let state = JSON.parse(localStorage.getItem("hikari_save")) || { coins: 0, stars: 0, area: "eiko", prog: {}, items: [] };
let activeSt = null;

function save() {
  localStorage.setItem("hikari_save", JSON.stringify(state));
  document.getElementById("coins").innerText = state.coins;
  document.getElementById("stars").innerText = state.stars;
}

function initWorld() {
  const container = document.getElementById("world-map");
  const svg = document.getElementById("world-svg");
  document.querySelectorAll("#world-map .node").forEach(e => e.remove());
  svg.innerHTML = "";

  AREAS.forEach(a => {
    const isLocked = state.stars < a.req;
    const n = document.createElement("div");
    n.className = `node ${isLocked ? 'locked' : ''}`;
    n.style.left = a.x + "%"; n.style.top = a.y + "%";
    n.innerHTML = `<div class="icon-box">${a.icon}</div><div class="label">${a.name} ${isLocked ? `(⭐${a.req})` : ''}</div>`;
    n.onclick = () => {
      if (isLocked) return alert(`⭐星が ${a.req} 個必要だよ！`);
      state.area = a.id;
      document.getElementById("player").style.left = a.x + "%";
      document.getElementById("player").style.top = a.y + "%";
      save();
      setTimeout(() => openStage(a), 500);
    };
    container.appendChild(n);
  });
  save();
}

function openStage(area) {
  document.getElementById("stage-title").innerText = `${area.icon} ${area.name}`;
  const container = document.getElementById("stage-map");
  document.querySelectorAll("#stage-map .node").forEach(e => e.remove());
  
  const list = STAGES[area.id] || [];
  list.forEach((st, idx) => {
    const y = 80 + idx * 80;
    const done = state.prog[st.id] || 0;
    const n = document.createElement("div");
    n.className = "node";
    n.style.left = (idx % 2 === 0 ? 35 : 65) + "%";
    n.style.top = y + "px";
    n.innerHTML = `<div class="icon-box" style="width:44px; height:44px; font-size:22px;">${st.icon}</div><div class="label">${st.name} (${done}/${st.max})</div>`;
    n.onclick = () => {
      activeSt = st;
      const v = VOICES[Math.floor(Math.random() * VOICES.length)];
      document.getElementById("m-title").innerText = st.name;
      document.getElementById("m-speaker").innerText = v.s + "：";
      document.getElementById("m-text").innerText = `「${v.t}」`;
      document.getElementById("m-task").innerText = st.task;
      document.getElementById("modal").classList.add("active");
    };
    container.appendChild(n);
  });
  showScreen("stage-screen");
}

function closeModal() { document.getElementById("modal").classList.remove("active"); }

function clearTask() {
  closeModal();
  state.coins += activeSt.coin;
  state.stars += 1;
  state.prog[activeSt.id] = (state.prog[activeSt.id] || 0) + 1;
  save();
  alert(`🎉 試練クリア！\n🪙 コイン +${activeSt.coin} ⭐ 星 +1`);
  openStage(AREAS.find(a => a.id === state.area));
}

function toggleTown() {
  const box = document.getElementById("town-items");
  box.innerHTML = state.items.map(i => SHOP.find(s => s.id === i)?.icon || '').join(" ");
  const shop = document.getElementById("shop");
  shop.innerHTML = SHOP.map(i => {
    const bought = state.items.includes(i.id);
    return `<div style="background:#fff; padding:10px; border-radius:10px;">
      <div style="font-size:24px;">${i.icon}</div>
      <div style="font-size:12px;">${i.name}</div>
      ${bought ? '<span style="font-size:11px; color:#aaa;">購入済</span>' : `<button onclick="buy('${i.id}', ${i.price})" style="background:#ff6b9d; color:#fff; border:none; padding:4px 8px; border-radius:10px; font-size:11px; margin-top:4px;">🪙 ${i.price}</button>`}
    </div>`;
  }).join("");
  showScreen("town-screen");
}

function buy(id, price) {
  if (state.coins < price) return alert("🪙 コインが足りないよ！");
  state.coins -= price;
  state.items.push(id);
  save();
  toggleTown();
}

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

window.onload = initWorld;
</script>
</body>
</html>
